<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Log Monitor</title>
    <link rel="stylesheet" href="/dashboard/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <section id="login-section">
        <h1>Security Log Monitor</h1>
        <form id="login-form">
            <input id="username" placeholder="Username" required>
            <input id="password" type="password" placeholder="Password" required>
            <button type="submit">Log in</button>
            <p id="login-error"></p>
        </form>
    </section>

    <main id="dashboard" hidden>
        <header>
            <h1>Security Log Monitor</h1>
            <button id="logout">Log out</button>
        </header>
        <div class="cards">
            <div class="card"><span id="alert-count">0</span> alerts</div>
            <div class="card"><span id="event-count">0</span> events</div>
        </div>
        <h2>Failed logins per IP</h2>
        <canvas id="chart"></canvas>
        <h2>Alerts</h2>
        <table id="alerts-table">
            <thead><tr><th>IP</th><th>Failures</th><th>First seen</th><th>Last seen</th></tr></thead>
            <tbody></tbody>
        </table>
        <h2>Events</h2>
        <table id="events-table">
            <thead><tr><th>Time</th><th>Status</th><th>User</th><th>IP</th><th>Port</th></tr></thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="/dashboard/app.js"></script>
</body>
</html>
